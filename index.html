    let currentFilter = 'all';
    let cart = JSON.parse(localStorage.getItem('radarCart') || '[]');

    function renderDeals() {
      const container = document.getElementById('dealsContainer');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = dealsData.filter(d => {
        const matchesFilter = (currentFilter === 'all') || (d.store === currentFilter);
        const matchesSearch = d.title.toLowerCase().includes(search) || d.category.toLowerCase().includes(search);
        return matchesFilter && matchesSearch;
      });

      document.getElementById('dealCount').innerText = `${filtered.length} Angebote gefunden`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center border border-slate-200 text-slate-400 text-xs">Keine passenden Angebote gefunden.</div>`;
        return;
      }

      container.innerHTML = filtered.map(d => {
        const diff = (d.normalPrice - d.appPrice).toFixed(2);
        const percent = Math.round(((d.normalPrice - d.appPrice) / d.normalPrice) * 100);
        const isInCart = cart.some(i => i.id === d.id);

        return `
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[11px] font-black px-2 py-0.5 rounded-md ${d.badgeStyle}">
                ${d.storeName}
              </span>
              <span class="text-xs font-black text-rose-600 bg-rose-50 px-2 py-0.5 rounded-md">
                -${percent}% mit App
              </span>
            </div>

            <h3 class="font-bold text-slate-900 text-sm">${d.title}</h3>
            <p class="text-xs text-slate-400 mb-2">${d.unit} • <span class="text-slate-500 font-medium">${d.category}</span></p>

            <div class="flex items-baseline gap-2 mb-2">
              <div>
                <span class="text-[10px] text-slate-400 uppercase font-bold">App-Preis:</span>
                <span class="text-lg font-black text-emerald-600 block">${d.appPrice.toFixed(2).replace('.', ',')} €</span>
              </div>
              <div class="ml-2">
                <span class="text-[10px] text-slate-400 uppercase font-bold">Normal:</span>
                <span class="text-xs text-slate-400 line-through block">${d.normalPrice.toFixed(2).replace('.', ',')} €</span>
              </div>
              <div class="ml-auto text-right">
                <span class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-md">
                  Sparst: ${diff.replace('.', ',')} €
                </span>
              </div>
            </div>

            <div class="bg-slate-50 p-1.5 rounded-lg mb-2 text-[11px] text-slate-600 flex items-center gap-1 font-medium">
              📲 ${d.appInfo}
            </div>

            <button 
              onclick="toggleCartItem(${d.id})" 
              class="w-full py-2 rounded-xl text-xs font-bold transition ${
                isInCart ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-white'
              }">
              ${isInCart ? '✓ Auf deinem Merkzettel' : '+ Auf Merkzettel'}
            </button>
          </div>
        `;
      }).join('');
    }

    function setFilter(store) {
      currentFilter = store;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-slate-900', 'text-white');
        btn.classList.add('bg-white', 'text-slate-700');
      });
      const active = document.getElementById(`btn-${store}`);
      if (active) {
        active.classList.remove('bg-white', 'text-slate-700');
        active.classList.add('bg-slate-900', 'text-white');
      }
      renderDeals();
    }

    function toggleCartItem(id) {
      const idx = cart.findIndex(i => i.id === id);
      if (idx > -1) {
        cart.splice(idx, 1);
      } else {
        const item = dealsData.find(d => d.id === id);
        if (item) cart.push({...item, done: false});
      }
      localStorage.setItem('radarCart', JSON.stringify(cart));
      updateBadge();
      renderDeals();
      renderCart();
    }

    function updateBadge() {
      const badge = document.getElementById('cartCountBadge');
      if (cart.length > 0) {
        badge.innerText = cart.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function toggleShoppingList() {
      document.getElementById('cartModal').classList.toggle('hidden');
      renderCart();
    }

    function toggleCheck(id) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.done = !item.done;
        localStorage.setItem('radarCart', JSON.stringify(cart));
        renderCart();
      }
    }

    function clearCart() {
      cart = [];
      localStorage.setItem('radarCart', JSON.stringify(cart));
      updateBadge();
      renderDeals();
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('cartItemsList');
      const totalEl = document.getElementById('totalSavings');

      if (cart.length === 0) {
        list.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">Dein Merkzettel ist leer.</p>`;
        totalEl.innerText = "0,00 €";
        return;
      }

      let total = 0;
      list.innerHTML = cart.map(item => {
        const diff = item.normalPrice - item.appPrice;
        total += diff;
        return `
          <div class="flex items-center justify-between p-2 rounded-xl border border-slate-200 bg-white ${item.done ? 'opacity-50 line-through' : ''}">
            <div class="flex items-center gap-2">
              <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCheck(${item.id})" class="w-4 h-4 rounded" />
              <div>
                <p class="text-xs font-bold text-slate-900">${item.title}</p>
                <p class="text-[10px] text-slate-400">${item.storeName} • ${item.appPrice.toFixed(2).replace('.', ',')} €</p>
              </div>
            </div>
            <span class="text-xs font-black text-emerald-600">+${diff.toFixed(2).replace('.', ',')} €</span>
          </div>
        `;
      }).join('');

      totalEl.innerText = `${total.toFixed(2).replace('.', ',')} €`;
    }

    updateBadge();
    renderDeals();
  </script>
